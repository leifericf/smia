name: Release and deploy

on:
  push:
    tags: ['20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]']   # YYYY-MM-DD (glob, not regex)

permissions:
  contents: write          # create the GitHub Release
  pages: write             # deploy GitHub Pages
  id-token: write          # Pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build every edition, cut a Release, deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Build every edition
        run: |
          clojure -M:run build manual \
            --edition screen \
            --edition print \
            --edition print-x \
            --edition epub \
            --edition site \
            --output-root build/release

      - name: Verify the download assets exist
        run: |
          d=build/release/clj-book-manual
          test -f "$d/pdf/clj-book-manual-screen.pdf"
          test -f "$d/pdf/clj-book-manual-print.pdf"
          test -f "$d/pdf/clj-book-manual-print-x.pdf"
          test -f "$d/epub/clj-book-manual.epub"

      - name: Set the custom domain (when configured)
        if: ${{ vars.PAGES_CUSTOM_DOMAIN != '' }}
        run: |
          echo "${{ vars.PAGES_CUSTOM_DOMAIN }}" \
            > build/release/clj-book-manual/site/CNAME

      - name: Create the Release with every downloadable edition
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/release/clj-book-manual/pdf/clj-book-manual-screen.pdf
            build/release/clj-book-manual/pdf/clj-book-manual-print.pdf
            build/release/clj-book-manual/pdf/clj-book-manual-print-x.pdf
            build/release/clj-book-manual/epub/clj-book-manual.epub

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/release/clj-book-manual/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
