name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Tests and dogfood build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Maven deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Pre-resolve deps
        run: clojure -P -A:test

      - name: Run unit + integration tests
        run: clojure -M:test

      - name: Validate dogfood manual with code checks
        run: clojure -M:run validate manual --validate-code

      - name: Build dogfood user manual (screen + print + site)
        run: |
          clojure -M:run:cljs:math:diagrams build manual \
            --edition screen \
            --edition print \
            --edition site \
            --output-root build/ci

      - name: Smoke-test the programmatic -X API
        run: clojure -X:build :book-root '"manual"' :dry-run true

      - name: Verify dogfood artifacts
        run: |
          test -f build/ci/smia-manual/pdf/smia-manual-screen.pdf
          test -f build/ci/smia-manual/pdf/smia-manual-print.pdf
          test -f build/ci/smia-manual/site/index.html
          test -f build/ci/smia-manual/site/search.js
          test -f build/ci/smia-manual/artifacts.edn

      - name: Upload dogfood artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dogfood-manual
          path: build/ci/smia-manual/pdf/
          retention-days: 7

  jar-smoke:
    name: Standalone jar smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the jar's version stamp uses git describe

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Maven deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2
            ~/.gitlibs
            ~/.deps.clj
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Build the standalone jar
        run: clojure -T:jar uber

      - name: Version surface
        run: java -jar target/smia.jar --version | grep '^Smia '

      - name: Init and build a scaffolded book from the jar
        run: |
          java -jar target/smia.jar init /tmp/smoke-book
          java -jar target/smia.jar build /tmp/smoke-book --output-root /tmp/smoke-out
          test -f /tmp/smoke-out/smoke-book/pdf/smoke-book-screen.pdf
          test -f /tmp/smoke-out/smoke-book/pdf/smoke-book-print.pdf

      - name: Build the manual site from the jar (islands, math, diagrams)
        run: |
          java -jar target/smia.jar build manual --edition site --output-root build/jar-smoke
          test -s build/jar-smoke/smia-manual/site/index.html
          test -s build/jar-smoke/smia-manual/site/search.js
          test -s build/jar-smoke/smia-manual/site/reader.js
          test -s build/jar-smoke/smia-manual/site/keys.js
